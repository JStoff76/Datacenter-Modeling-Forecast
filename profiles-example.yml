# Example dbt `profiles.yml` for Snowflake.
# Copy this to `%USERPROFILE%\\.dbt\\profiles.yml` and fill the environment variables or values.
# It uses environment variables to avoid checking secrets into git.

my_snowflake_profile:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "${SNOWFLAKE_ACCOUNT}"       # e.g. xy12345.us-east-1
      user: "${SNOWFLAKE_USER}"
      password: "${SNOWFLAKE_PASSWORD}"
      role: "${SNOWFLAKE_ROLE:-SYSADMIN}"
      warehouse: "${SNOWFLAKE_WAREHOUSE}"
      database: "${SNOWFLAKE_DATABASE}"
      schema: "${SNOWFLAKE_SCHEMA}"
      threads: 4
      client_session_keep_alive: False

# Alternative auth using key-pair (recommended for automation). Replace with the path to your private key file and passphrase if used.
#    dev:
#      type: snowflake
#      account: "${SNOWFLAKE_ACCOUNT}"
#      user: "${SNOWFLAKE_USER}"
#      private_key_path: "${SNOWFLAKE_PRIVATE_KEY_PATH}"
#      private_key_passphrase: "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}"
#      role: "${SNOWFLAKE_ROLE}"
#      warehouse: "${SNOWFLAKE_WAREHOUSE}"
#      database: "${SNOWFLAKE_DATABASE}"
#      schema: "${SNOWFLAKE_SCHEMA}"
#      threads: 4

# Notes:
# - Set environment variables in PowerShell like:
#     $env:SNOWFLAKE_ACCOUNT = 'xy12345.us-east-1'
#     $env:SNOWFLAKE_USER = 'MYUSER'
#     $env:SNOWFLAKE_PASSWORD = 'mypassword'
# - Or create a `.env` and load it in your shell/session. Avoid committing credentials.