# Example dbt `profiles.yml` for Snowflake using SSO (externalbrowser authenticator).
# Copy this to `%USERPROFILE%\\.dbt\\profiles.yml` and set the environment variables shown below.

my_snowflake_profile:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"       # e.g. UW17194-MOLEXPRODNA.snowflakecomputing.com
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: externalbrowser
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4
      client_session_keep_alive: False

# Notes:
# - This configuration will open a browser window for SSO when you run `dbt debug` or other dbt commands.
# - Do not store passwords here when using externalbrowser.